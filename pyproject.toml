[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-encoder"
version = "0.1.0"
description = "Anchor-frame motion encoder for world-model history compression"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "einops>=0.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
svd = ["diffusers>=0.25"]
safetensors = ["safetensors>=0.4"]
test = ["pytest>=7"]
example = ["decord>=0.6", "pillow>=10", "imageio[ffmpeg]>=2"]

[tool.setuptools.packages.find]
include = ["memory_encoder*"]
